name: Run Telegram Bot (Every 6 Hours)

on:
  schedule:
    - cron: '0 */6 * * *'   # هر ۶ ساعت (ساعت 0، 6، 12، 18 UTC)
  workflow_dispatch:          # اجرای دستی

concurrency:
  group: bot-run
  cancel-in-progress: false   # اگر اجرای قبلی هنوز تمام نشده، اجرای جدید شروع نشود

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # حداکثر ۶ ساعت (مطابق با فاصله اجراها)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          QUESTIONS_CHANNEL_ID: ${{ secrets.QUESTIONS_CHANNEL_ID }}
          ANSWERS_CHANNEL_ID: ${{ secrets.ANSWERS_CHANNEL_ID }}
        run: |
          python -m bot.main
